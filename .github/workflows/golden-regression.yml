# 골든셋 v0.2 로 판정 코드의 회귀를 잰다. DB·API 키 없이 돈다.
#
# 게이트: 잘못된 확정 0, 정답 일치가 기준선(samples/golden/qualification-v0.2/summary.json)
# 아래로 안 내려감. 상세 결과는 artifact 로만 남기고 리포에 쌓지 않는다.
#
# 이 잡이 초록이어도 제품 추출 경로는 보증하지 않는다 — canonical 요건을 판정 코드에
# 직접 넣기 때문이다. 추출 재현율은 run_extraction_recall.py 로 따로 잰다.
name: golden-regression

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/api/app/qualification/**"
      - "apps/api/app/ai/qualification/**"
      - "apps/api/app/ai/contracts.py"
      - "samples/golden/qualification-v0.2/**"
      - "scripts/run_golden_regression.py"
      - ".github/workflows/golden-regression.yml"
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: golden-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  judge:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Verify frozen fixture checksums
        working-directory: samples/golden/qualification-v0.2
        run: sha256sum -c checksums.sha256

      - name: Rule-engine safety tests
        run: >-
          python -m pytest -q
          apps/api/tests/test_clause_safety_decorations.py
          apps/api/tests/test_requirement_extraction.py
          apps/api/tests/test_extraction_recall.py
          apps/api/tests/test_qualification_judgment.py
          apps/api/tests/test_askability.py

      - name: Golden regression (gate)
        run: python scripts/run_golden_regression.py --out artifacts/golden_regression.json

      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-regression-${{ github.sha }}
          path: artifacts/golden_regression.json
          retention-days: 30
