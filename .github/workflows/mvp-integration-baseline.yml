name: MVP Integration Baseline CI

on:
  pull_request:
    branches:
      - integration/mvp-baseline
      - develop
      - main
  push:
    branches:
      - integration/mvp-baseline

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bidjigi
          POSTGRES_USER: bidjigi
          POSTGRES_PASSWORD: bidjigi_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidjigi -d bidjigi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://bidjigi:bidjigi_local_password@localhost:5432/bidjigi
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Apply database migrations
        working-directory: apps/api
        run: python -m alembic upgrade head

      - name: Run backend regression suite
        run: python -m pytest -q apps/api/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: apps/web
        run: pnpm lint

      - name: Build frontend
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm build
