name: Qualification Reliability Verification

on:
  push:
    branches: [refactor/qualification-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-reliability-${{ github.ref }}
  cancel-in-progress: true

# 공용 DB/실제 모델/배포 자격증명을 사용하지 않는다.
# 이 workflow 통과는 실제 공고 추출 정확도나 운영 E2E 통과를 뜻하지 않는다.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qualification_test
          POSTGRES_USER: qualification_test
          POSTGRES_PASSWORD: local_test_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U qualification_test -d qualification_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://qualification_test:local_test_only@localhost:5432/qualification_test
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Pin reproducible tracked source
        run: |
          mkdir -p .artifacts/qualification
          git rev-parse HEAD > .artifacts/qualification/commit.txt
          git archive --format=tar.gz HEAD apps scripts > .artifacts/qualification/source.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install project dependencies
        id: install
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Apply migrations to disposable database
        id: migrations
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Run complete backend regression suite
        if: ${{ !cancelled() && steps.migrations.outcome == 'success' }}
        run: python -m pytest -q apps/api/tests --junitxml=.artifacts/qualification/backend.xml
      - name: Run existing frozen golden regression without changing expectations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/run_golden_regression.py
      - name: Preserve test report and source basis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-backend-${{ github.sha }}
          path: .artifacts/qualification/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install frozen lockfile
        id: install
        run: pnpm install --frozen-lockfile
      - name: Execute checked-in Node unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p ../../.artifacts/qualification-web
          node --test tests/*.test.cjs 2>&1 | tee ../../.artifacts/qualification-web/node-tests.log
      - name: Verify existing Copilot client contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/check-copilot.mjs
          node scripts/check-copilot-actions.mjs
          node scripts/check-copilot-integration.mjs
          node scripts/check-copilot-semantic.mjs
          node scripts/check-copilot-target-memory.mjs
      - name: Typecheck whole frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc --noEmit 2>&1 | tee ../../.artifacts/qualification-web/typecheck.log
      - name: Build whole frontend
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build 2>&1 | tee ../../.artifacts/qualification-web/build.log
      - name: Browser integration with synthetic HTTP only
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          OUT="$GITHUB_WORKSPACE/.artifacts/qualification-web/browser"
          mkdir -p "$OUT"
          npm install --prefix "$RUNNER_TEMP/qualification-browser" --no-save playwright@1.56.1 > "$OUT/install.log" 2>&1
          "$RUNNER_TEMP/qualification-browser/node_modules/.bin/playwright" install --with-deps chromium >> "$OUT/install.log" 2>&1
          pnpm dev --host localhost --port 3000 > "$OUT/web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          READY=0
          for n in $(seq 1 60); do
            if ! kill -0 "$WEB_PID" 2>/dev/null; then cat "$OUT/web.log"; exit 1; fi
            if curl -fsS http://localhost:3000/ -o /dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then cat "$OUT/web.log"; exit 1; fi
          export QUALIFICATION_UI_URL=http://localhost:3000
          export QUALIFICATION_SCREENSHOT_DIR="$OUT"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/qualification-browser/node_modules/playwright"
          node scripts/check-qualification-browser.cjs 2>&1 | tee "$OUT/check.log"
          node scripts/check-qualification-graph-browser.cjs 2>&1 | tee "$OUT/graph-check.log"
      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-frontend-${{ github.sha }}
          path: .artifacts/qualification-web/
          if-no-files-found: ignore
          retention-days: 7
